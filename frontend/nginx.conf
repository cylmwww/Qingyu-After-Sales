server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
