name: qingyu-rag
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20
  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${RAG_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-rag-local-only}@db:5432/rag
    command: ["python", "-m", "backend.cli", "seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${RAG_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-rag-local-only}@db:5432/rag
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  rag_pgdata:
